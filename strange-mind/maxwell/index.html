<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Le vent invisible · Strange Mind</title>
  <meta name="description" content="Le vent invisible : 9 mini-jeux pour sentir, dès 6 ans, les idées des équations de Maxwell (fontaines, tourbillons, courants, aimants).">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section id="home" class="screen" hidden>
    <header class="home-head">
      <a class="icon-btn" href="../" data-t-title="Accueil Strange Mind" title="Accueil Strange Mind">🏠</a>
      <h1 data-t>Le vent invisible <small>Maxwell</small></h1>
      <button id="opt-voice" class="icon-btn" data-t-title title="Voix">🗣️</button>
      <button id="opt-sound" class="icon-btn" data-t-title title="Son">🔊</button>
      <button id="opt-lang" class="icon-btn"></button>
    </header>
    <div class="modes">
      <button id="btn-rush" class="mode rush"><span class="big">⚡</span><b>Rush 60 s</b><small id="rush-best"></small></button>
      <button id="btn-daily" class="mode daily"><span class="big">📅</span><b data-t>Défi du jour</b><small id="daily-best"></small></button>
    </div>
    <div id="games" class="games"></div>
    <p class="foot" data-t="foot">Un vent invisible souffle partout. Il <b>sort</b> des fontaines, il <b>tourne</b> autour des fils
      électriques, et il naît quand un aimant <b>bouge</b>. Chaque partie = 10 défis ; 4 réussites d'affilée font monter d'un
      niveau et gagner une médaille 🥉🥈🥇💎.</p>
  </section>

  <section id="play" class="screen" hidden>
    <header id="hud">
      <button id="btn-home" class="icon-btn" data-t-title title="Accueil">🏠</button>
      <div class="mid"><div id="hud-title" class="title"></div><div id="hud-prog" class="prog"></div></div>
      <div id="hud-streak" class="streak"></div>
      <div class="score"><b id="hud-score">0</b></div>
    </header>
    <div class="bubble">
      <span id="mascot" class="mascot">🦉</span>
      <p id="say"></p>
      <span id="lvl" class="lvl"></span>
      <button id="btn-say" class="icon-btn small" data-t-title title="Réécouter">🔊</button>
    </div>
    <div class="stage">
      <canvas id="scene"></canvas>
      <div id="feedback"></div>
    </div>
    <div id="options" class="options" hidden></div>
    <div id="controls" class="controls" hidden></div>
  </section>

  <div id="modal" hidden><div class="modal-card"><div class="modal-body"></div></div></div>
  <canvas id="confetti"></canvas>
  <script type="module" src="js/main.js"></script>
</body>
</html>
